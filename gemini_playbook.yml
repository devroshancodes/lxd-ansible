---
- name: Deploy LXC Nginx Load-Balanced Stack with PostgreSQL
  hosts: lxc_host
  become: true
  vars:
    container_distro: ubuntu
    container_release: noble  # Using Ubuntu 24.04 LTS
    
    # Network Configuration (Adjust subnet/gateway to match your lxcbr0 setup)
    lxc_gateway: "10.145.169.1"
    
    db_server: { name: 'db-01', ip: '10.145.169.133' }
    load_balancer: { name: 'lb-01', ip: '10.145.169.177' }
    web_servers:
      - { name: 'web-01', ip: '10.145.169.98' }
      - { name: 'web-02', ip: '10.145.169.213' }

  tasks:
    # -------------------------------------------------------------------------
    # 1. CONTAINER PROVISIONING
    # -------------------------------------------------------------------------
    - name: Create Database Container
      community.general.lxc_container:
        name: "{{ db_server.name }}"
        template: "{{ container_distro }}"
        state: started
        template_options: "--release {{ container_release }}"
        container_config:
          - "lxc.net.0.ipv4.address = {{ db_server.ip }}/24"
          - "lxc.net.0.ipv4.gateway = {{ lxc_gateway }}"

    - name: Create Web Server Containers
      community.general.lxc_container:
        name: "{{ item.name }}"
        template: "{{ container_distro }}"
        state: started
        template_options: "--release {{ container_release }}"
        container_config:
          - "lxc.net.0.ipv4.address = {{ item.ip }}/24"
          - "lxc.net.0.ipv4.gateway = {{ lxc_gateway }}"
      loop: "{{ web_servers }}"

    - name: Create Nginx Load Balancer Container
      community.general.lxc_container:
        name: "{{ load_balancer.name }}"
        template: "{{ container_distro }}"
        state: started
        template_options: "--release {{ container_release }}"
        container_config:
          - "lxc.net.0.ipv4.address = {{ load_balancer.ip }}/24"
          - "lxc.net.0.ipv4.gateway = {{ lxc_gateway }}"

    # -------------------------------------------------------------------------
    # 2. DATABASE CONFIGURATION
    # -------------------------------------------------------------------------
    - name: Install PostgreSQL
      delegate_to: "{{ db_server.name }}"
      ansible.builtin.apt:
        name: 
          - postgresql
          - postgresql-contrib
        state: present
        update_cache: true

    - name: Configure PostgreSQL to listen on all internal interfaces
      delegate_to: "{{ db_server.name }}"
      ansible.builtin.lineinfile:
        path: /etc/postgresql/16/main/postgresql.conf
        regexp: "^#?listen_addresses\\s*="
        line: "listen_addresses = '*'"
      notify: Restart PostgreSQL

    - name: Allow Web Servers to connect to PostgreSQL
      delegate_to: "{{ db_server.name }}"
      ansible.builtin.blockinfile:
        path: /etc/postgresql/16/main/pg_hba.conf
        block: |
          # Allow the web server subnet to connect via MD5 authentication
          host    all             all             10.0.3.0/24             md5
      notify: Restart PostgreSQL

    # -------------------------------------------------------------------------
    # 3. WEB SERVERS CONFIGURATION
    # -------------------------------------------------------------------------
    - name: Install Nginx on Web Servers
      delegate_to: "{{ item.name }}"
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
      loop: "{{ web_servers }}"

    - name: Create distinctive index pages for testing verification
      delegate_to: "{{ item.name }}"
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "<h1>Hello from backend web node: {{ item.name }}</h1>"
        mode: '0644'
      loop: "{{ web_servers }}"

    # -------------------------------------------------------------------------
    # 4. LOAD BALANCER CONFIGURATION
    # -------------------------------------------------------------------------
    - name: Install Nginx on Load Balancer
      delegate_to: "{{ load_balancer.name }}"
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Configure Nginx Load Balancer Upstream
      delegate_to: "{{ load_balancer.name }}"
      ansible.builtin.blockinfile:
        path: /etc/nginx/sites-available/default
        block: |
          upstream backend_servers {
              # Least_conn or round-robin can be used here
              least_conn; 
              {% for server in web_servers %}
              server {{ server.ip }}:80 max_fails=3 fail_timeout=30s;
              {% endfor %}
          }

          server {
              listen 80 default_server;
              listen [::]:80 default_server;

              server_name _;

              location / {
                  proxy_pass http://backend_servers;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Restart Nginx Load Balancer

  handlers:
    - name: Restart PostgreSQL
      delegate_to: "{{ db_server.name }}"
      ansible.builtin.service:
        name: postgresql
        state: restarted

    - name: Restart Nginx Load Balancer
      delegate_to: "{{ load_balancer.name }}"
      ansible.builtin.service:
        name: nginx
        state: restarted
