---
    # Task 1: Configure the Load Balancer
    - name: Configure Load Balancer
      hosts: loadbalancers
      tasks:
        - name: Install Nginx
          apt:
            name: nginx
            state: present
            update_cache: yes

        - name: Copy Load Balancer Configuration
          template:
            src: template/lb-nginx.conf
            dest: /etc/nginx/sites-available/default

        - name: Restart Nginx to apply config
          service:
            name: nginx
            state: restarted

    # Task 2: Configure Web Servers
    - name: Configure Web Nodes
      hosts: webservers
      tasks:
        - name: Install Nginx
          apt:
            name: nginx
            state: present
            update_cache: yes

        - name: Remove default Nginx welcome file
          file:
            path: /var/www/html/index.nginx-debian.html
            state: absent

        - name: Create Custom HTML on Web 01
          copy:
            content: "<h1>Welcome to Web Node ALPHA (01)</h1>"
            dest: /var/www/html/index.html
          when: inventory_hostname == 'web-01'

        - name: Create Custom HTML on Web 02
          copy:
            content: "<h1>Welcome to Web Node BETA (02)</h1>"
            dest: /var/www/html/index.html
          when: inventory_hostname == 'web-02'
# Task 3: Configure Database Server
    - name: Configure Database Node
      hosts: databases
      become: yes
      vars:
       lxc_subnet: "10.0.10.0/24"
      tasks:
        - name: Install PostgreSQL and Python dependencies
          apt:
            name: 
              - postgresql
              - python3-psycopg2  # Required for Ansible's postgresql modules
            state: present
            update_cache: yes

        - name: Allow PostgreSQL to listen on all interfaces
          lineinfile:
            path: /etc/postgresql/16/main/postgresql.conf
            regexp: '^#?listen_addresses\s*='
            line: "listen_addresses = '*'"
          notify: Restart PostgreSQL

        - name: Allow remote connections from LXC subnet
          postgresql_pg_hba:
            dest: /etc/postgresql/16/main/pg_hba.conf
            contype: host
            databases: all
            method: md5
            users: all
            address: "{{ lxc_subnet }}"  # Replace with your actual LXC subnet
          notify: Restart PostgreSQL

      handlers:
        - name: Restart PostgreSQL
          service:
            name: postgresql
            state: restarted
...
